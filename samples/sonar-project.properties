# Scanner config for the Creedengo Android Kotlin rule samples.
# Run from this directory:
#   sonar-scanner -Dsonar.token=<token>
# or from the repo root:
#   sonar-scanner -Dsonar.projectBaseDir=samples -Dsonar.token=<token>

sonar.projectKey=creedengo-android-kotlin-samples
sonar.projectName=Creedengo Android Kotlin — Rule Samples
sonar.projectVersion=0.0.1

# Sources live alongside this file
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Kotlin language — the sonar-kotlin plugin picks .kt files up automatically,
# but pinning it avoids surprises if other languages get added later.
sonar.lang.patterns.kotlin=**/*.kt

# Local SonarQube from docker-compose.yml at the repo root
sonar.host.url=http://localhost:9000

# Quality profile note:
# The GCI522 rule (BrightnessOverrideRule) must be active in the Kotlin
# quality profile used by this project, otherwise nothing will be reported.
