[versions]
kotlin = "2.0.21"
shadow = "8.3.6"
sonar-plugin-api = "9.8.0.203"
sonar-kotlin-plugin = "3.0.1.6889"
sonar-analyzer-commons = "2.5.0.1358"
sonarqube-plugin-api-impl = "10.4.0.87286"
junit-jupiter = "5.10.2"
assertj = "3.25.3"

[libraries]
sonarsource-kotlin-plugin = { module = "org.sonarsource.kotlin:sonar-kotlin-plugin", version.ref = "sonar-kotlin-plugin" }
sonarsource-plugin-api = { module = "org.sonarsource.api.plugin:sonar-plugin-api", version.ref = "sonar-plugin-api" }
sonarsource-analyzer-commons = { module = "org.sonarsource.analyzer-commons:sonar-analyzer-commons", version.ref = "sonar-analyzer-commons" }
sonarsource-plugin-api-impl = { module = "org.sonarsource.sonarqube:sonar-plugin-api-impl", version.ref = "sonarqube-plugin-api-impl" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
